<title>bag_27</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
/* Layout: sticky slim header, split hero (text + large drawn bag), 3-col product grid that stacks, order form beside delivery notes. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --fg:#14171C; --muted:#5A616C; --line:#D5D9DF;
  --accent:#2447F5; --accent-fg:#FFFFFF; --soft:#E1E6FB;
  --display:'Bricolage Grotesque','Readex Pro',system-ui,sans-serif;
  --body:'Readex Pro','Bricolage Grotesque',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#171B22; --fg:#EEF0F4; --muted:#9AA2AF; --line:#272D37;
    --accent:#7E93FF; --accent-fg:#0E1116; --soft:#1C2340; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --fg:#EEF0F4; --muted:#9AA2AF; --line:#272D37;
  --accent:#7E93FF; --accent-fg:#0E1116; --soft:#1C2340; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;padding-inline:20px;padding-block:0;margin:0}
.wrap{max-width:1080px;margin-inline:auto}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;direction:ltr}
.logo svg{width:40px;height:40px;flex:none}
.logo .word{font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;line-height:1}
.logo .word i{font-style:normal;color:var(--accent)}
nav{display:flex;align-items:center;gap:6px}
nav a.l{display:none;text-decoration:none;padding:8px 12px;font-size:.92rem;color:var(--muted)}
nav a.l:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:inherit;font-size:.85rem;font-weight:500;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media(min-width:720px){nav a.l{display:block}}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-block:56px 48px}
.eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 14px}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:.9rem}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.9rem);line-height:1.08;letter-spacing:-.025em;margin:0 0 18px;text-wrap:balance}
[dir="rtl"] h1{line-height:1.3;letter-spacing:0}
.lead{color:var(--muted);max-width:46ch;margin:0 0 28px;font-size:1.05rem}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;text-decoration:none;border-radius:12px;padding:14px 24px;min-height:50px;cursor:pointer;border:1.5px solid var(--fg);background:transparent;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:hover{transform:translateY(-1px)}
.hero-art{background:var(--soft);border-radius:28px;padding:24px;display:grid;place-items:center;aspect-ratio:1/1;max-width:100%}
.hero-art svg{width:100%;height:auto;max-width:360px}

section{padding-block:48px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
[dir="rtl"] h2{line-height:1.35;letter-spacing:0}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .pic{background:var(--soft);padding:22px;display:grid;place-items:center}
.card .pic svg{width:100%;max-width:220px;height:auto}
.card .pic img.photo{width:100%;max-width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block}
.card .info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-family:var(--display);font-size:1.12rem;margin:0;font-weight:700;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.pick{font:inherit;font-size:.9rem;font-weight:600;color:var(--accent);background:transparent;border:1.5px solid var(--accent);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.pick:hover{background:var(--accent);color:var(--accent-fg)}
.note{font-size:.85rem;color:var(--muted);margin-top:18px}

.why{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.why div{border-top:2px solid var(--fg);padding-top:14px}
.why h3{font-family:var(--display);margin:0 0 6px;font-size:1.15rem}
.why p{margin:0;color:var(--muted);font-size:.95rem}

.order{display:grid;grid-template-columns:.8fr 1.2fr;gap:36px;align-items:start}
form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:16px}
label{display:grid;gap:6px;font-size:.88rem;font-weight:500}
input,select{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;width:100%}
input:focus,select:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fine{font-size:.82rem;color:var(--muted);margin:0}

footer{border-top:1px solid var(--line);margin-inline:-20px;padding:28px 20px 36px;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

@media(max-width:860px){
  .hero{grid-template-columns:1fr;padding-block:36px 28px}
  .hero-art{aspect-ratio:auto;padding:20px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .why{grid-template-columns:1fr;gap:20px}
  .order{grid-template-columns:1fr}
}
@media(max-width:520px){
  .grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){.btn:hover{transform:none}}
</style>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="bag_27">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="16" fill="var(--fg)"/>
        <path d="M20 30 C20 12, 44 12, 44 30" fill="none" stroke="var(--bg)" stroke-width="3.2" stroke-linecap="round"/>
        <rect x="14" y="28" width="36" height="24" rx="7" fill="var(--accent)"/>
        <path d="M14 37 H50" stroke="var(--bg)" stroke-width="1.8" stroke-dasharray="3 2.4" opacity=".85"/>
        <circle cx="43" cy="33" r="1.8" fill="var(--bg)"/>
      </svg>
      <span class="word">bag<i>_</i>27</span>
    </a>
    <nav>
      <a class="l" href="#produits" data-t="nav1"></a>
      <a class="l" href="#commander" data-t="nav2"></a>
      <div class="lang" role="group" aria-label="Langue / اللغة">
        <button type="button" id="b-ar" data-lang="ar">العربية</button>
        <button type="button" id="b-fr" data-lang="fr">Français</button>
      </div>
    </nav>
  </div>
</header>

<main class="wrap" id="top">
  <div class="hero">
    <div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="cta">
        <a class="btn primary" href="#produits" data-t="cta1"></a>
        <a class="btn" href="#commander" data-t="cta2"></a>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true" id="heroArt"></div>
  </div>

  <section id="produits">
    <h2 data-t="h2a"></h2>
    <p class="sub" data-t="suba"></p>
    <div class="grid" id="grid"></div>
    <p class="note" data-t="note"></p>
  </section>

  <section>
    <div class="why">
      <div><h3 data-t="w1h"></h3><p data-t="w1p"></p></div>
      <div><h3 data-t="w2h"></h3><p data-t="w2p"></p></div>
      <div><h3 data-t="w3h"></h3><p data-t="w3p"></p></div>
    </div>
  </section>

  <section id="commander">
    <div class="order">
      <div>
        <h2 data-t="h2b"></h2>
        <p class="sub" data-t="subb"></p>
      </div>
      <form id="f" novalidate>
        <label for="prod"><span data-t="fProd"></span><select id="prod"></select></label>
        <div class="two">
          <label for="nom"><span data-t="fName"></span><input id="nom" type="text" autocomplete="name"></label>
          <label for="tel"><span data-t="fTel"></span><input id="tel" type="tel" inputmode="tel" autocomplete="tel" dir="ltr"></label>
        </div>
        <label for="wil"><span data-t="fWil"></span><input id="wil" type="text"></label>
        <a class="btn primary" id="wa" href="#" target="_blank" rel="noopener" data-t="send"></a>
        <p class="fine" data-t="fine"></p>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 bag_27</span>
    <span data-t="foot"></span>
  </div>
</footer>

<script>
/* ===== À MODIFIER / للتعديل ===== */
var WA_NUMBER = "";            // ex: "213551234567" (indicatif sans + ni 00)
// img: رابط أو مسار صورة المنتج / lien ou chemin de la photo (ex: "photos/sac1.jpg"). Laisser "" pour garder le dessin.
var PRODUCTS = [
  {id:1, img:"", body:"#1B1D22", strap:"#3A3E48", flap:"#000", price:2800, fr:["Sacoche classique noire","Zip central, bandoulière réglable"], ar:["حقيبة كلاسيكية سوداء","سحاب أمامي وحزام قابل للتعديل"]},
  {id:2, body:"#C9AE84", strap:"#2B2A28", flap:"#8E7550", price:2800, fr:["Sacoche sable","Toile enduite, léger et résistant"], ar:["حقيبة بلون الرمل","قماش مطلي، خفيفة ومتينة"]},
  {id:3, body:"#5E6B3F", strap:"#262A1F", flap:"#323A20", price:2900, fr:["Sacoche olive","Deux compartiments"], ar:["حقيبة زيتونية","جيبان داخليان"]},
  {id:4, body:"#1F2F5C", strap:"#12182B", flap:"#0F1B3D", price:2900, fr:["Sacoche bleu nuit","Format idéal pour téléphone et clés"], ar:["حقيبة أزرق ليلي","مقاس مناسب للهاتف والمفاتيح"], stripe:"#E7E9F2"},
  {id:5, body:"#8A8E96", strap:"#2D3036", flap:"#5E626A", price:2700, fr:["Sacoche grise","Finition mate, usage quotidien"], ar:["حقيبة رمادية","لمسة مطفية للاستعمال اليومي"]},
  {id:6, body:"#7B3F2E", strap:"#2A1812", flap:"#4C2418", price:3000, fr:["Sacoche brique","Bandoulière large, confortable"], ar:["حقيبة بلون الطوب","حزام عريض ومريح"], stripe:"#E8D6C6"}
];

var T = {
  fr:{nav1:"Modèles",nav2:"Commander",eyebrow:"Sacoches bandoulière",
    h1:"Des sacoches pour tous les jours.",
    lead:"Légères, solides et faciles à porter. Choisissez votre modèle, envoyez votre commande sur WhatsApp et recevez-la chez vous.",
    cta1:"Voir les modèles",cta2:"Commander",h2a:"Nos modèles",suba:"Chaque sacoche a un zip principal, une bandoulière réglable et une doublure propre.",
    note:"Les prix et modèles affichés sont à confirmer par le vendeur.",
    w1h:"Livraison en Algérie",w1p:"Expédition vers toutes les wilayas. Le délai est confirmé sur WhatsApp.",
    w2h:"Paiement à la livraison",w2p:"Vous payez quand vous recevez la sacoche et que vous l'avez vérifiée.",
    w3h:"Réponse rapide",w3p:"Une question sur la taille ou la couleur ? Écrivez-nous, on répond le jour même.",
    h2b:"Passer commande",subb:"Remplissez le formulaire. Votre message est prêt à envoyer sur WhatsApp.",
    fProd:"Modèle",fName:"Nom complet",fTel:"Téléphone",fWil:"Wilaya",send:"Envoyer sur WhatsApp",
    fine:"Le bouton ouvre WhatsApp avec votre commande déjà écrite.",foot:"Sacoches bandoulière · Algérie",
    pick:"Choisir",da:"DA",
    msg:function(p,n,t,w){return "Bonjour bag_27, je veux commander : "+p+"\nNom : "+n+"\nTéléphone : "+t+"\nWilaya : "+w;}},
  ar:{nav1:"النماذج",nav2:"اطلب الآن",eyebrow:"حقائب كتف صغيرة",
    h1:"حقائب لكل يوم.",
    lead:"خفيفة ومتينة وسهلة الحمل. اختر النموذج، أرسل طلبك عبر واتساب، واستلمه عند بابك.",
    cta1:"شاهد النماذج",cta2:"اطلب الآن",h2a:"نماذجنا",suba:"كل حقيبة بسحاب رئيسي وحزام قابل للتعديل وبطانة نظيفة.",
    note:"الأسعار والنماذج المعروضة تؤكَّد من طرف البائع.",
    w1h:"توصيل داخل الجزائر",w1p:"نشحن إلى كل الولايات. نؤكد لك مدة التوصيل عبر واتساب.",
    w2h:"الدفع عند الاستلام",w2p:"تدفع عندما تستلم الحقيبة وتتأكد منها.",
    w3h:"ردّ سريع",w3p:"سؤال عن المقاس أو اللون؟ راسلنا ونجيبك في نفس اليوم.",
    h2b:"أرسل طلبك",subb:"املأ النموذج، وتصلك رسالة جاهزة للإرسال عبر واتساب.",
    fProd:"النموذج",fName:"الاسم الكامل",fTel:"رقم الهاتف",fWil:"الولاية",send:"أرسل عبر واتساب",
    fine:"الزر يفتح واتساب والطلب مكتوب مسبقًا.",foot:"حقائب كتف · الجزائر",
    pick:"اختيار",da:"دج",
    msg:function(p,n,t,w){return "مرحبا bag_27، أريد طلب: "+p+"\nالاسم: "+n+"\nالهاتف: "+t+"\nالولاية: "+w;}}
};

function bag(p, big){
  if(p.img && !big){ return '<img class="photo" src="'+p.img+'" alt="" loading="lazy">'; }
  var s = '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">'
   + '<path d="M44 56 C44 -10, 156 -10, 156 56" fill="none" stroke="'+p.strap+'" stroke-width="9" stroke-linecap="round"/>'
   + '<rect x="18" y="48" width="164" height="92" rx="24" fill="'+p.body+'"/>'
   + '<path d="M18 80 H182" stroke="'+p.flap+'" stroke-width="2.4" stroke-dasharray="6 5" opacity=".7"/>'
   + (p.stripe ? '<rect x="94" y="48" width="12" height="92" fill="'+p.stripe+'" opacity=".9"/>' : '')
   + '<rect x="86" y="48" width="28" height="22" rx="4" fill="'+p.strap+'"/>'
   + '<rect x="150" y="60" width="16" height="6" rx="3" fill="'+p.flap+'"/>'
   + '<circle cx="160" cy="63" r="2.6" fill="#fff" opacity=".85"/>'
   + '</svg>';
  return s;
}

var lang = "ar";
try{ var sv = localStorage.getItem("bag27-lang"); if(sv==="fr"||sv==="ar") lang = sv; }catch(e){}

function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," "); }

function render(){
  var t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = "bag_27";
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = t[el.getAttribute("data-t")]; });
  document.getElementById("b-ar").setAttribute("aria-pressed", lang==="ar");
  document.getElementById("b-fr").setAttribute("aria-pressed", lang==="fr");

  var grid = document.getElementById("grid"), sel = document.getElementById("prod"), cur = sel.value;
  grid.innerHTML = ""; sel.innerHTML = "";
  PRODUCTS.forEach(function(p){
    var d = p[lang];
    var c = document.createElement("article"); c.className = "card";
    c.innerHTML = '<div class="pic">'+bag(p)+'</div><div class="info"><h3></h3><p></p><div class="row"><span class="price"></span><button type="button" class="pick" data-id="'+p.id+'"></button></div></div>';
    c.querySelector("h3").textContent = d[0];
    var im = c.querySelector("img.photo"); if(im) im.alt = d[0];
    c.querySelector("p").textContent = d[1];
    c.querySelector(".price").textContent = fmt(p.price)+" "+t.da;
    c.querySelector(".pick").textContent = t.pick;
    grid.appendChild(c);
    var o = document.createElement("option"); o.value = p.id; o.textContent = d[0]+" — "+fmt(p.price)+" "+t.da; sel.appendChild(o);
  });
  if(cur) sel.value = cur;
  document.getElementById("heroArt").innerHTML = bag(PRODUCTS[3], true);
  updateLink();
}

function updateLink(){
  var t = T[lang], id = +document.getElementById("prod").value || 1;
  var p = PRODUCTS.filter(function(x){return x.id===id;})[0];
  var txt = t.msg(p[lang][0]+" ("+fmt(p.price)+" "+t.da+")",
    document.getElementById("nom").value||"-",
    document.getElementById("tel").value||"-",
    document.getElementById("wil").value||"-");
  var base = WA_NUMBER ? "https://wa.me/"+WA_NUMBER : "https://wa.me/";
  document.getElementById("wa").href = base+"?text="+encodeURIComponent(txt);
}

document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){
    lang = b.getAttribute("data-lang");
    try{ localStorage.setItem("bag27-lang", lang); }catch(e){}
    render();
  });
});
document.getElementById("grid").addEventListener("click", function(e){
  var b = e.target.closest(".pick"); if(!b) return;
  document.getElementById("prod").value = b.getAttribute("data-id");
  updateLink();
  document.getElementById("commander").scrollIntoView({behavior:"smooth"});
});
["prod","nom","tel","wil"].forEach(function(id){
  document.getElementById(id).addEventListener("input", updateLink);
  document.getElementById(id).addEventListener("change", updateLink);
});
document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); });
render();
</script>
